version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: placement_tracker_db
    environment:
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: placement_password
      POSTGRES_DB: placement_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placement_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement_tracker_backend
    environment:
      - DATABASE_URL=postgresql://placement_user:placement_password@db:5432/placement_tracker
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placement_tracker_frontend
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - backend

volumes:
  postgres_data:
